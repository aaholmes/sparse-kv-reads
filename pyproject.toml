[project]
name = "ssa"
version = "0.1.0"
description = "Semi-stochastic sparse attention: unbiased sampled estimators of LLM decode attention"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    # Qwen3 inference engine from github.com/aaholmes/llms. Provides the `engine`
    # package and the decode-attention hook the real-model harnesses plug into.
    "specd",
    "transformers>=4.45",
    "datasets>=2.18",
    "matplotlib>=3.7",
]

[tool.uv.sources]
specd = { git = "https://github.com/aaholmes/llms", rev = "96c47251eb2727a5636e00faf118ec91cb4addda" }

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
